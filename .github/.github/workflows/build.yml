name: Build RedGlass Native 5-HUD APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Generate Complete Native Android Project
      run: |
        mkdir -p app/src/main/java/com/redglass/jarvis
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        cat << 'EOF' > settings.gradle
        rootProject.name = "RedGlassAI"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.4'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20'
            }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        # 3. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.redglass.jarvis'
            compileSdk 34
            defaultConfig {
                applicationId "com.redglass.jarvis"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        }
        EOF

        # 4. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.redglass.jarvis">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
            <uses-permission android:name="android.permission.INTERNET" />

            <application
                android:allowBackup="true"
                android:label="RedGlass JARVIS"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".FloatingHUDService"
                    android:enabled="true"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

        # 5. MainActivity.kt (Auto Permission Trigger)
        cat << 'EOF' > app/src/main/java/com/redglass/jarvis/MainActivity.kt
        package com.redglass.jarvis

        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                    val intent = Intent(
                        Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                        Uri.parse("package:$packageName")
                    )
                    startActivityForResult(intent, 1234)
                } else {
                    startHUDService()
                }
            }

            private fun startHUDService() {
                val intent = Intent(this, FloatingHUDService::class.java)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(intent)
                } else {
                    startService(intent)
                }
                finish()
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == 1234) {
                    startHUDService()
                }
            }
        }
        EOF

        # 6. FloatingHUDService.kt (5 Overlay HUD Windows)
        cat << 'EOF' > app/src/main/java/com/redglass/jarvis/FloatingHUDService.kt
        package com.redglass.jarvis

        import android.app.Notification
        import android.app.NotificationChannel
        import android.app.NotificationManager
        import android.app.Service
        import android.content.Intent
        import android.graphics.Color
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.Gravity
        import android.view.View
        import android.view.WindowManager
        import android.widget.LinearLayout
        import android.widget.TextView

        class FloatingHUDService : Service() {
            private lateinit var windowManager: WindowManager
            private val floatingViews = mutableListOf<View>()

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                startForegroundServiceNotification()
                
                createFloatingWindow("🔴 RedGlass Status: ACTIVE [Sub-1s Engine]", Gravity.TOP or Gravity.CENTER_HORIZONTAL, 0, 80)
                createFloatingWindow("⚡ JARVIS Screen perception active", Gravity.CENTER, 0, -120)
                createFloatingWindow("🟡 Yellow Text: Formula / Key Concept", Gravity.CENTER, 0, 50)
                createFloatingWindow("🟢 Green Text: Solution Output Ready", Gravity.CENTER, 0, 220)
                createFloatingWindow("🔘 Master ON/OFF Switch Panel", Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL, 0, 180)
            }

            private fun createFloatingWindow(titleText: String, gravity: Int, xOffset: Int, yOffset: Int) {
                val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }

                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    layoutParamsType,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    this.gravity = gravity
                    this.x = xOffset
                    this.y = yOffset
                }

                val hudView = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setBackgroundColor(Color.parseColor("#E61A0505"))
                    setPadding(35, 25, 35, 25)
                    
                    val textView = TextView(context).apply {
                        text = titleText
                        setTextColor(Color.WHITE)
                        textSize = 13f
                    }
                    addView(textView)
                }

                windowManager.addView(hudView, params)
                floatingViews.add(hudView)
            }

            private fun startForegroundServiceNotification() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel("jarvis_hud", "JARVIS HUD Active", NotificationManager.IMPORTANCE_LOW)
                    val manager = getSystemService(NotificationManager::class.java)
                    manager.createNotificationChannel(channel)
                    val notification = Notification.Builder(this, "jarvis_hud")
                        .setContentTitle("RedGlass JARVIS Active")
                        .setContentText("5 Native Floating Windows running...")
                        .setSmallIcon(android.R.drawable.ic_dialog_info)
                        .build()
                    startForeground(1, notification)
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                floatingViews.forEach { windowManager.removeView(it) }
            }
        }
        EOF

    - name: Build APK with Gradle Action
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RedGlass-JARVIS-APK
        path: app/build/outputs/apk/debug/*.apk
